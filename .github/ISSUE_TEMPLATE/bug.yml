name: "Bug"
description: "Report incorrect behavior"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        To delegate the fix to the agent, add the `claude-implement` label or comment
        `@claude fix this` whenever you want.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (version, OS, path, etc.)
